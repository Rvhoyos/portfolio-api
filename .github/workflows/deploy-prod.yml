# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Gradle

concurrency:
  group: deploy-prod
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    environment: prod
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build fat JAR
      run: ./gradlew --no-daemon clean bootJar

    - name: Build Docker image (local)
      run: docker build -t portfolio-api:prod .

    - name: Ensure deploy dir + isolated network exist and write compose
      run: |
        sudo mkdir -p /opt/portfolio-api-prod
        sudo mkdir -p /opt/portfolio-api-prod/migrations
        sudo chown -R "$USER":"$USER" /opt/portfolio-api-prod

        docker network inspect portfolio-api-prod_appnet >/dev/null 2>&1 || {
          echo "ERROR: Docker network 'portfolio-api-prod_appnet' not found. Aborting." >&2
          exit 1
        }

        cat > /opt/portfolio-api-prod/compose.yml <<'YAML'
        services:
          app:
            image: portfolio-api:prod
            container_name: portfolio-api-prod
            restart: unless-stopped
            env_file:
              - /opt/portfolio-api-prod/.env.prod
            ports:
              - "127.0.0.1:18081:8081"
            networks:
              - appnet

          flyway:
            image: flyway/flyway:latest
            container_name: portfolio-api-prod-flyway
            networks:
              - appnet

        networks:
          appnet:
            external: true
            name: portfolio-api-prod_appnet
        YAML

    - name: Sync migrations to prod server
      run: rsync -a --delete "$GITHUB_WORKSPACE/src/main/resources/db/migration/" "/opt/portfolio-api-prod/migrations/"

    - name: Run Flyway migrations (prod DB)
      run: docker compose -f /opt/portfolio-api-prod/compose.yml --env-file /opt/portfolio-api-prod/.env.prod run --rm flyway

    - name: Deploy app (internal only)
      run: docker compose -f /opt/portfolio-api-prod/compose.yml --env-file /opt/portfolio-api-prod/.env.prod up -d --no-deps --force-recreate app

    - name: Tail app logs
      run: docker compose -f /opt/portfolio-api-prod/compose.yml --env-file /opt/portfolio-api-prod/.env.prod logs -n 60 app || true

  dependency-submission:
    runs-on: [self-hosted, Linux, X64, portfolio-api]
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
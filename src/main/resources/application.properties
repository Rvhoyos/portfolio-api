spring.application.name=portfolio-api
server.port=8081

# For staging/prod, inject these via env (Compose/server),
# so nothing secret lives in the repo.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Flyway OFF by default. Only 'dev' enables it.
spring.flyway.enabled=false
# JPA won't manage schema; Flyway owns migrations.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
